name: security-audit

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    name: dependency advisories
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      # cargo-audit fails on RustSec vulnerabilities and prints informational
      # warnings (unmaintained or unsound crates) without failing the run.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Tauri Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Audit analyzer Rust dependencies
        run: cargo audit --file sidecar/cobolens-analyze/Cargo.lock
